name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: petsearch
          POSTGRES_PASSWORD: petsearch
          POSTGRES_DB: petsearch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petsearch"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://petsearch:petsearch@localhost:5432/petsearch_test
      E2E_DATABASE_URL: postgres://petsearch:petsearch@localhost:5432/petsearch_e2e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Traceability
        run: npm run check:trace
        env:
          TRACE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
      - name: Docker image builds
        run: docker build -t petsearch:ci .
      - name: Create E2E database
        run: psql "$TEST_DATABASE_URL" -c "CREATE DATABASE petsearch_e2e OWNER petsearch"
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: npx playwright test
